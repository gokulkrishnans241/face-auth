services:
  - type: web
    name: smart-attendance-backend
    env: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CLIENT_URL
        sync: false
